[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmcul"
version = "0.1.0"
description = "Trustworthiness of webcam-based upper-limb movement quality measures"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
# pose model runners (SAM 3D Body additionally needs its repo, see notebook 02)
pose = [
    "opencv-python",
    "mediapipe",
]
eval = [
    "pandas",
    "matplotlib",
]
# biomechanical fit (mmcul.fit); CPU wheels are enough
fit = [
    "torch",
]
dev = [
    "pytest",
    "pandas",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
